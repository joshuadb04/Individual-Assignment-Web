<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="stylesheet.css" />
    <script type="module" src="./src/login-register.js"></script>
    <script type="module" src="./src/auth.js"></script>
    <title>BiteCo - Register</title>
  </head>

  <body>
    <header>
      <h1 id="logo">
        <a href="index.html">BiteCo.</a>
      </h1>

      <nav id="nav-bar">
        <div id="nav-select2">
          <a class="page" id="restaurants-link" href="restaurants.html">Restaurants</a>
          <a class="page" id="profile-link" href="profile.html">Profile</a>
          <a class="page" id="login-link" href="login-register.html">Login</a>
        </div>
      </nav>
    </header>

    <main id="register-page">
      <div id="login-section">
        <h2>Login</h2>

        <form id="login-form">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" required />

          <label for="login-password">Password</label>
          <input type="password" id="login-password" required />

          <button type="submit">Login</button>
        </form>
      </div>

      <div id="register-section">
        <h2>Register</h2>

        <form id="register-form">
          <label for="username">Username</label>
          <input type="text" id="username" required />

          <label for="email">Email</label>
          <input type="email" id="email" required />

          <label for="password">Password</label>
          <input type="password" id="password" required />

          <button type="submit">Register</button>

          <p id="register-message"></p>
        </form>
      </div>
    </main>

    <footer>
      <p class="footer-text">
        Everything you're seeing is still temporary and basically empty, and subject to change in the future.
      </p>
      <p class="footer-text">-J</p>
    </footer>
  </body>
</html>
